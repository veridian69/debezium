debezium.sink.type=http
debezium.sink.http.url=http://receiver:8080/events
debezium.sink.http.timeout.ms=5000
debezium.sink.http.retries=10
debezium.sink.http.retry.interval.ms=3000
debezium.sink.http.batch.enabled=false

debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=dbz
debezium.source.database.password=dbz
debezium.source.database.dbname=appdb
debezium.source.topic.prefix=plumbing
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=dbz_slot
debezium.source.publication.name=dbz_publication
debezium.source.publication.autocreate.mode=filtered
debezium.source.schema.include.list=timecritical
debezium.source.table.include.list=timecritical.customers,timecritical.orders,timecritical.order_items
debezium.source.snapshot.mode=initial
debezium.source.tombstones.on.delete=false

quarkus.http.port=8080
quarkus.log.console.json=false
quarkus.log.level=INFO
